
services:
  postgres:
    image: postgres:16
    container_name: paylink-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paylink_db}
      POSTGRES_USER: ${POSTGRES_USER:-paylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paylink123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paylink} -d ${POSTGRES_DB:-paylink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: paylink-app:latest
    container_name: paylink-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paylink_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paylink}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paylink123}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
