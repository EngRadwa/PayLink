
services:
  postgres:
    image: postgres:16
    container_name: paylink-db
    environment:
      POSTGRES_DB: paylink_db
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
